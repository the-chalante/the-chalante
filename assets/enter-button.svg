<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" font-family="'JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono','Courier New',monospace">
<style>
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.shine{animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-200px)}60%,100%{transform:translateX(820px)}}
.chev{animation:chev 1.2s steps(3) infinite}
@keyframes chev{0%{opacity:.2}33%{opacity:.6}66%,100%{opacity:1}}
.tick{animation:tick 22.4s linear infinite}
@keyframes tick{from{transform:translateX(-1584.0px)}to{transform:translateX(0)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<defs>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="t" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="tg" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#ff6a00" stop-opacity="0"/><stop offset=".5" stop-color="#ffb000" stop-opacity=".22"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0a0605"/><stop offset=".08" stop-color="#0a0605" stop-opacity="0"/><stop offset=".92" stop-color="#0a0605" stop-opacity="0"/><stop offset="1" stop-color="#0a0605"/></linearGradient>
<clipPath id="in"><rect x="20" y="20" width="680" height="196"/></clipPath>
<clipPath id="band"><rect x="22" y="128" width="676" height="86"/></clipPath>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#000" opacity=".5"/></pattern>
</defs>
<rect class="pulse" x="20" y="20" width="680" height="196" fill="none" stroke="#ff6a00" stroke-width="8" filter="url(#g)"/>
<rect x="20" y="20" width="680" height="196" fill="#0a0605" stroke="#ff6a00" stroke-width="3"/>
<g clip-path="url(#in)"><rect class="shine" x="0" y="0" width="160" height="236" fill="url(#sh)" transform="skewX(-20)"/></g>
<path d="M12 38V12H38" fill="none" stroke="#ff2a1a" stroke-width="4"/>
<path d="M708 38V12H682" fill="none" stroke="#ff2a1a" stroke-width="4"/>
<path d="M12 198V224H38" fill="none" stroke="#ff2a1a" stroke-width="4"/>
<path d="M708 198V224H682" fill="none" stroke="#ff2a1a" stroke-width="4"/>
<text x="360.0" y="92" font-size="46" font-weight="800" fill="#ff6a00" text-anchor="middle" textLength="414" lengthAdjust="spacingAndGlyphs" filter="url(#t)">ENTER THE SWARM</text>
<text class="chev" style="animation-delay:0.0s" x="83.0" y="90" font-size="34" font-weight="bold" fill="#ff2a1a">&gt;</text>
<text class="chev" style="animation-delay:0.4s" x="589.0" y="90" font-size="34" font-weight="bold" fill="#ff2a1a">&lt;</text>
<text class="chev" style="animation-delay:0.2s" x="101.0" y="90" font-size="34" font-weight="bold" fill="#ff2a1a">&gt;</text>
<text class="chev" style="animation-delay:0.2s" x="607.0" y="90" font-size="34" font-weight="bold" fill="#ff2a1a">&lt;</text>
<text class="chev" style="animation-delay:0.4s" x="119.0" y="90" font-size="34" font-weight="bold" fill="#ff2a1a">&gt;</text>
<text class="chev" style="animation-delay:0.0s" x="625.0" y="90" font-size="34" font-weight="bold" fill="#ff2a1a">&lt;</text>
<rect x="22" y="126" width="676" height="1.5" fill="#39ff7a" opacity=".5"/>
<rect x="22" y="128" width="676" height="86" fill="#03140a"/>
<g clip-path="url(#band)"><g class="tick">
<text x="0.0" y="196" font-size="30" font-weight="bold" fill="#39ff7a" letter-spacing="0" textLength="1584.0" lengthAdjust="spacingAndGlyphs" filter="url(#tg)">PYTORCH  //  SPARK  //  AIRFLOW  //  OPENCV  //  SCIKIT-LEARN  //  PYTHON  //  C++  //  </text>
<text x="1584.0" y="196" font-size="30" font-weight="bold" fill="#39ff7a" letter-spacing="0" textLength="1584.0" lengthAdjust="spacingAndGlyphs" filter="url(#tg)">PYTORCH  //  SPARK  //  AIRFLOW  //  OPENCV  //  SCIKIT-LEARN  //  PYTHON  //  C++  //  </text>
<text x="3168.0" y="196" font-size="30" font-weight="bold" fill="#39ff7a" letter-spacing="0" textLength="1584.0" lengthAdjust="spacingAndGlyphs" filter="url(#tg)">PYTORCH  //  SPARK  //  AIRFLOW  //  OPENCV  //  SCIKIT-LEARN  //  PYTHON  //  C++  //  </text>
</g><rect x="22" y="128" width="676" height="86" fill="url(#fade)"/></g>
<text x="32" y="148" font-size="13" fill="#39ff7a" opacity=".85" letter-spacing="3" class="blink">● ARSENAL</text>
<g clip-path="url(#in)"><rect width="720" height="236" fill="url(#scan)"/></g>
</svg>